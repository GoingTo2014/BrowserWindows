<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>BrowserWindows · Sign in</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f4f4f5;background:#09090b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    main{width:min(100%,390px);padding:28px;border:1px solid #303038;border-radius:18px;background:#151519;box-shadow:0 20px 70px #0008}
    h1{font-size:24px;margin:0 0 8px}p{color:#a1a1aa;line-height:1.5;margin:0 0 22px}
    label{display:block;font-size:14px;margin-bottom:8px}input{width:100%;padding:13px;border:1px solid #454550;border-radius:10px;background:#09090b;color:white;font:inherit}
    button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:#2563eb;color:white;font:600 15px system-ui;cursor:pointer}
    .error{color:#fca5a5;margin:0 0 16px}.note{font-size:12px;margin-top:18px;margin-bottom:0}
  </style>
</head>
<body>
  <main>
    <h1>BrowserWindows</h1>
    <p>Sign in to access your temporary remote desktop.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label for="password">Session password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Connect to desktop</button>
    </form>
    <p class="note">This session is temporary. Anyone with access to the password can control the desktop.</p>
  </main>
</body>
</html>
