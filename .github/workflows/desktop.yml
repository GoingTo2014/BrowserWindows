name: Start BrowserWindows session

on:
  workflow_dispatch:
  push:
    paths:
      - "server.py"

permissions:
  contents: read

# Do not let a second manual start silently cancel an already-running desktop.
# A BrowserWindows session is intentionally long-lived.
concurrency:
  group: browserwindows-session
  cancel-in-progress: false

jobs:
  desktop:
    # This is Windows Server 2022, not a Windows 10 VM.
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Check out BrowserWindows
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate password secret
        shell: pwsh
        env:
          DESKTOP_PASSWORD: ${{ secrets.DESKTOP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DESKTOP_PASSWORD)) {
            throw "Missing DESKTOP_PASSWORD. Add it under Settings > Secrets and variables > Actions."
          }
          if ($env:DESKTOP_PASSWORD.Length -lt 12) {
            throw "DESKTOP_PASSWORD must be at least 12 characters long."
          }
          "Desktop password secret is configured."

      - name: Cache desktop tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/browserwindows-tools
          key: windows-2022-desktop-tools-v1

      - name: Install FFmpeg and Cloudflare tunnel
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "browserwindows-tools"
          $null = New-Item -ItemType Directory -Path $tools -Force

          $ffmpegExe = Get-ChildItem -Path $tools -Filter "ffmpeg.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ffmpegExe) {
            $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials.zip"
            $destination = Join-Path $tools "ffmpeg"
            Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $archive
            Expand-Archive -Path $archive -DestinationPath $destination -Force
            Remove-Item $archive -Force -ErrorAction SilentlyContinue
            $ffmpegExe = Get-ChildItem -Path $destination -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          }
          if (-not $ffmpegExe) { throw "ffmpeg.exe was not found in the downloaded archive or cache." }
          $ffmpegExe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $ffmpegExe.FullName -version | Select-Object -First 1

          $cloudflared = Join-Path $tools "cloudflared.exe"
          if (-not (Test-Path $cloudflared)) {
            Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cloudflared
          }
          & $cloudflared --version

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check --only-binary=av -r requirements.txt
          python -c "import aiortc, av, numpy, flask_sock; print('WebRTC dependencies OK; aiortc=' + aiortc.__version__ + ', PyAV=' + av.__version__)"

      - name: Start BrowserWindows desktop streamer and tunnel
        shell: pwsh
        env:
          DESKTOP_PASSWORD: ${{ secrets.DESKTOP_PASSWORD }}
          COOKIE_SECURE: "1"
        run: |
          $env:APP_SECRET = [guid]::NewGuid().ToString("N") + [guid]::NewGuid().ToString("N")

          $serverOut = Join-Path $env:RUNNER_TEMP "browserwindows-server.log"
          $serverErr = Join-Path $env:RUNNER_TEMP "browserwindows-server.err"
          $server = Start-Process -FilePath "python" -ArgumentList @("server.py") -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden -RedirectStandardOutput $serverOut -RedirectStandardError $serverErr

          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8080/login" -UseBasicParsing -TimeoutSec 3
              if ($response.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
            if ($server.HasExited) { break }
          }
          if (-not $ready) {
            if (Test-Path $serverOut) { Get-Content $serverOut }
            if (Test-Path $serverErr) { Get-Content $serverErr }
            throw "The desktop streamer did not start. See server logs above."
          }

          $cloudflared = Join-Path (Join-Path $env:RUNNER_TEMP "browserwindows-tools") "cloudflared.exe"
          $tunnelOut = Join-Path $env:RUNNER_TEMP "browserwindows-tunnel.log"
          $tunnelErr = Join-Path $env:RUNNER_TEMP "browserwindows-tunnel.err"
          $tunnel = Start-Process -FilePath $cloudflared -ArgumentList @("tunnel", "--no-autoupdate", "--url", "http://127.0.0.1:8080") -PassThru -WindowStyle Hidden -RedirectStandardOutput $tunnelOut -RedirectStandardError $tunnelErr

          $publicUrl = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            $logs = ""
            foreach ($file in @($tunnelOut, $tunnelErr)) {
              if (Test-Path $file) { $logs += (Get-Content $file -Raw -ErrorAction SilentlyContinue) + "`n" }
            }
            $match = [regex]::Match($logs, "https://[a-z0-9-]+\.trycloudflare\.com")
            if ($match.Success) { $publicUrl = $match.Value; break }
            if ($tunnel.HasExited) { break }
          }

          if (-not $publicUrl) {
            if (Test-Path $tunnelOut) { Get-Content $tunnelOut }
            if (Test-Path $tunnelErr) { Get-Content $tunnelErr }
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            throw "Could not obtain a Cloudflare Quick Tunnel URL."
          }

          $summary = @"
          ## BrowserWindows session is running

          **Desktop URL:** $publicUrl

          **Video:** H.264 over the existing WebSocket/TCP path. The browser uses this same WebSocket for desktop input, while the cursor test uses the separate HTTP test endpoint so it cannot interfere with the stream.

          Sign in with the password stored in the repository secret `DESKTOP_PASSWORD`.
          This is a temporary Windows Server 2022 runner, not Windows 10. The session ends when this workflow is cancelled, the runner shuts down, or the 350-minute workflow timeout is reached.
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "BrowserWindows URL: $publicUrl"
          Write-Host "The password is not printed in the logs."

          try {
            while (-not $server.HasExited -and -not $tunnel.HasExited) {
              Start-Sleep -Seconds 10
            }
            if ($server.HasExited) {
              if (Test-Path $serverOut) { Get-Content $serverOut }
              if (Test-Path $serverErr) { Get-Content $serverErr }
              throw "The desktop streamer stopped unexpectedly."
            }
            if ($tunnel.HasExited) {
              if (Test-Path $tunnelOut) { Get-Content $tunnelOut }
              if (Test-Path $tunnelErr) { Get-Content $tunnelErr }
              throw "The Cloudflare tunnel stopped unexpectedly."
            }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $tunnel.Id -Force -ErrorAction SilentlyContinue
          }
